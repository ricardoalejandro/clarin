name: Storage self-service QA

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/storage-self-service.spec.ts'
      - 'scripts/qa/run-storage-self-service.sh'
      - '.github/workflows/storage-self-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go and native PostgreSQL 16 / MinIO integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Backend unit tests
        working-directory: backend
        run: go test ./...
      - name: Native storage integration with isolated synthetic accounts
        run: bash scripts/qa/run-storage-self-service.sh

  frontend:
    name: Frontend unit, build and browser UI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm --prefix frontend ci
      - name: Prepare the existing whiteboard dependency
        run: npm --prefix frontend run prepare:excalidraw
      - name: Frontend unit tests and types
        run: npm --prefix frontend run test:unit && npm --prefix frontend run typecheck
      - name: Production build
        run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
      - name: Storage browser UI (API responses mocked)
        env:
          PLAYWRIGHT_LOCAL_SERVER: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3011
        run: npx playwright test tests/storage-self-service.spec.ts --project=chromium --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: storage-browser-failures
          path: test-results
          retention-days: 7
