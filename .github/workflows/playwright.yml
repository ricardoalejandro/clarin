name: Clarin Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Run validation in the Clarin environment before pushing (make qa).
  # Browser scenarios are selected explicitly; they do not block this workflow.
  # Five minutes is a normal-duration target; allow slower container builds.
  deploy:
    name: Deploy main over SSH
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: clarin-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://clarin.naperu.cloud
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Deploy the requested commit and verify the running services
      env:
        DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '72.61.37.46' }}
        DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/proyect/clarin' }}
      run: bash scripts/deploy/deploy-ssh.sh
