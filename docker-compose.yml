services:
  postgres:
    image: postgres:16-alpine
    container_name: clarin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clarin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clarin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clarin}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clarin-internal

  redis:
    image: redis:7-alpine
    container_name: clarin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clarin-internal

  minio:
    image: minio/minio:latest
    container_name: clarin-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clarinadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clarin-internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clarin-minio.rule=Host(`media.clarin.naperu.cloud`)"
      - "traefik.http.routers.clarin-minio.entrypoints=websecure"
      - "traefik.http.routers.clarin-minio.tls=true"
      - "traefik.http.routers.clarin-minio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-minio.service=clarin-minio"
      - "traefik.http.services.clarin-minio.loadbalancer.server.port=9000"
      - "traefik.http.routers.clarin-minio-console.rule=Host(`minio.clarin.naperu.cloud`)"
      - "traefik.http.routers.clarin-minio-console.entrypoints=websecure"
      - "traefik.http.routers.clarin-minio-console.tls=true"
      - "traefik.http.routers.clarin-minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-minio-console.service=clarin-minio-console"
      - "traefik.http.services.clarin-minio-console.loadbalancer.server.port=9001"

  codex-bridge:
    build:
      context: ./codex-bridge
      dockerfile: ../deploy/Dockerfile.codex-bridge
    container_name: clarin-codex-bridge
    restart: unless-stopped
    environment:
      PORT: 8787
      CODEX_HOME: /var/lib/codex
      EROS_CODEX_BRIDGE_TOKEN: ${EROS_CODEX_BRIDGE_TOKEN:-}
      EROS_CODEX_MODEL: ${EROS_CODEX_MODEL:-}
      EROS_CODEX_REASONING_EFFORT: ${EROS_CODEX_REASONING_EFFORT:-}
      EROS_CODEX_REQUEST_TIMEOUT_MS: ${EROS_CODEX_REQUEST_TIMEOUT_MS:-180000}
      EROS_MCP_BASE_URL: ${EROS_MCP_BASE_URL:-http://clarin-backend:8081/mcp}
      EROS_MCP_ACCESS_TOKEN: ${EROS_MCP_ACCESS_TOKEN:-}
    volumes:
      - codex_bridge_home:/var/lib/codex
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${EROS_CODEX_BRIDGE_TOKEN}\" ]; then wget -q --spider --header=\"Authorization: Bearer $${EROS_CODEX_BRIDGE_TOKEN}\" http://127.0.0.1:8787/live; else wget -q --spider http://127.0.0.1:8787/live; fi"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - clarin-internal

  backend:
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: clarin-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clarin}:${POSTGRES_PASSWORD}@clarin-postgres:5432/${POSTGRES_DB:-clarin}?sslmode=disable
      REDIS_URL: redis://clarin-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
      ENV: production
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@clarin.naperu.cloud}
      CORS_ORIGINS: https://clarin.naperu.cloud,https://www.clarin.naperu.cloud,http://localhost:3000,http://localhost:8080
      MINIO_ENDPOINT: clarin-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-clarinadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: clarin-media
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: https://media.clarin.naperu.cloud
      # Kommo CRM
      KOMMO_SUBDOMAIN: ${KOMMO_SUBDOMAIN:-}
      KOMMO_CLIENT_ID: ${KOMMO_CLIENT_ID:-}
      KOMMO_CLIENT_SECRET: ${KOMMO_CLIENT_SECRET:-}
      KOMMO_ACCESS_TOKEN: ${KOMMO_ACCESS_TOKEN:-}
      KOMMO_REDIRECT_URI: ${KOMMO_REDIRECT_URI:-}
      KOMMO_PROXY_URL: ${KOMMO_PROXY_URL:-}
      # Kommo Webhooks
      KOMMO_WEBHOOK_SECRET: ${KOMMO_WEBHOOK_SECRET:-}
      # WhatsApp Cloud API / Embedded Signup directo con Meta
      WHATSAPP_CLOUD_APP_ID: ${WHATSAPP_CLOUD_APP_ID:-}
      WHATSAPP_CLOUD_VERIFY_TOKEN: ${WHATSAPP_CLOUD_VERIFY_TOKEN:-}
      WHATSAPP_CLOUD_APP_SECRET: ${WHATSAPP_CLOUD_APP_SECRET:-}
      WHATSAPP_CLOUD_CONFIG_ID: ${WHATSAPP_CLOUD_CONFIG_ID:-}
      WHATSAPP_CLOUD_GRAPH_VERSION: ${WHATSAPP_CLOUD_GRAPH_VERSION:-v23.0}
      WHATSAPP_CLOUD_TOKEN_ENCRYPTION_KEY: ${WHATSAPP_CLOUD_TOKEN_ENCRYPTION_KEY:-}
      # Own statuses remain disabled until each capability is proven with a real WhatsApp Web device.
      WHATSAPP_STATUS_ENABLED: ${WHATSAPP_STATUS_ENABLED:-true}
      WHATSAPP_STATUS_SYNC_ENABLED: ${WHATSAPP_STATUS_SYNC_ENABLED:-true}
      PUBLIC_URL: "https://clarin.naperu.cloud"
      # AI Assistant (Eros)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      EROS_ENABLED: ${EROS_ENABLED:-true}
      EROS_PROVIDER: ${EROS_PROVIDER:-codex_bridge}
      EROS_CODEX_BRIDGE_URL: ${EROS_CODEX_BRIDGE_URL:-http://clarin-codex-bridge:8787}
      EROS_CODEX_BRIDGE_TOKEN: ${EROS_CODEX_BRIDGE_TOKEN:-}
      EROS_CODEX_AUTH_MODE: ${EROS_CODEX_AUTH_MODE:-chatgpt_subscription}
      EROS_CODEX_MODEL: ${EROS_CODEX_MODEL:-gpt-5.4-mini}
      EROS_CODEX_REASONING_EFFORT: ${EROS_CODEX_REASONING_EFFORT:-medium}
      EROS_MCP_BASE_URL: ${EROS_MCP_BASE_URL:-http://clarin-backend:8081/mcp}
      EROS_MCP_ACCESS_TOKEN: ${EROS_MCP_ACCESS_TOKEN:-}
      EROS_CODEX_BRIDGE_TIMEOUT: ${EROS_CODEX_BRIDGE_TIMEOUT:-195s}
      # Google Contacts sync
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Cloudflare Turnstile (login protection)
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # SOCKS5 proxy for WhatsApp CDN media uploads (Cloudflare WARP)
      MEDIA_SOCKS5_PROXY: socks5://host-gateway:40001
    extra_hosts:
      - "host-gateway:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      codex-bridge:
        condition: service_started
    volumes:
      - whatsapp_sessions:/app/sessions
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      # Keep local diagnostics available without exposing a direct path that
      # bypasses Traefik's route-specific request-body limits.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    networks:
      - clarin-internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.clarin-api.rule=Host(`clarin.naperu.cloud`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/health`))"
      - "traefik.http.routers.clarin-api.entrypoints=websecure"
      - "traefik.http.routers.clarin-api.tls=true"
      - "traefik.http.routers.clarin-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.clarin-api.loadbalancer.server.port=8080"
      - "traefik.http.routers.clarin-api.service=clarin-api"
      - "traefik.http.routers.clarin-api.priority=100"
      # Public whiteboard link exchange accepts only a tiny JSON credential
      # envelope. This higher-priority router rejects oversized bodies at the
      # edge, before Fiber's global 52 MiB upload parser can allocate them.
      - "traefik.http.routers.clarin-whiteboard-guest-session.rule=Host(`clarin.naperu.cloud`) && Method(`POST`) && PathRegexp(`(?i)^/api/public/whiteboard-links/[0-9a-f-]+/session/?$`)"
      - "traefik.http.routers.clarin-whiteboard-guest-session.entrypoints=websecure"
      - "traefik.http.routers.clarin-whiteboard-guest-session.tls=true"
      - "traefik.http.routers.clarin-whiteboard-guest-session.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-whiteboard-guest-session.service=clarin-api"
      - "traefik.http.routers.clarin-whiteboard-guest-session.priority=250"
      - "traefik.http.routers.clarin-whiteboard-guest-session.middlewares=clarin-whiteboard-guest-session-limit"
      - "traefik.http.middlewares.clarin-whiteboard-guest-session-limit.buffering.maxRequestBodyBytes=16384"
      - "traefik.http.middlewares.clarin-whiteboard-guest-session-limit.buffering.memRequestBodyBytes=16384"
      # Authenticated public-library starts, callbacks and completion ACKs carry
      # only opaque control data. Reject large bodies before Fiber's parser.
      - "traefik.http.routers.clarin-whiteboard-library-start.rule=Host(`clarin.naperu.cloud`) && Method(`POST`) && PathRegexp(`(?i)^/api/whiteboards/[0-9a-f-]+/public-library-import/start/?$`)"
      - "traefik.http.routers.clarin-whiteboard-library-start.entrypoints=websecure"
      - "traefik.http.routers.clarin-whiteboard-library-start.tls=true"
      - "traefik.http.routers.clarin-whiteboard-library-start.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-whiteboard-library-start.service=clarin-api"
      - "traefik.http.routers.clarin-whiteboard-library-start.priority=260"
      - "traefik.http.routers.clarin-whiteboard-library-start.middlewares=clarin-whiteboard-library-import-limit"
      - "traefik.http.routers.clarin-whiteboard-library-callback.rule=Host(`clarin.naperu.cloud`) && Method(`POST`) && PathRegexp(`(?i)^/api/whiteboards/public-library-import/callback/?$`)"
      - "traefik.http.routers.clarin-whiteboard-library-callback.entrypoints=websecure"
      - "traefik.http.routers.clarin-whiteboard-library-callback.tls=true"
      - "traefik.http.routers.clarin-whiteboard-library-callback.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-whiteboard-library-callback.service=clarin-api"
      - "traefik.http.routers.clarin-whiteboard-library-callback.priority=260"
      - "traefik.http.routers.clarin-whiteboard-library-callback.middlewares=clarin-whiteboard-library-import-limit"
      - "traefik.http.routers.clarin-whiteboard-library-complete.rule=Host(`clarin.naperu.cloud`) && Method(`POST`) && PathRegexp(`(?i)^/api/whiteboards/[0-9a-f-]+/public-library-imports/[0-9a-f-]+/complete/?$`)"
      - "traefik.http.routers.clarin-whiteboard-library-complete.entrypoints=websecure"
      - "traefik.http.routers.clarin-whiteboard-library-complete.tls=true"
      - "traefik.http.routers.clarin-whiteboard-library-complete.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-whiteboard-library-complete.service=clarin-api"
      - "traefik.http.routers.clarin-whiteboard-library-complete.priority=260"
      - "traefik.http.routers.clarin-whiteboard-library-complete.middlewares=clarin-whiteboard-library-import-limit"
      - "traefik.http.middlewares.clarin-whiteboard-library-import-limit.buffering.maxRequestBodyBytes=4096"
      - "traefik.http.middlewares.clarin-whiteboard-library-import-limit.buffering.memRequestBodyBytes=4096"
      # Comment reads stay on the ordinary API router. Only mutation methods
      # match these higher-priority, exact-path 16 KiB routers.
      - "traefik.http.routers.clarin-whiteboard-comment-post.rule=Host(`clarin.naperu.cloud`) && Method(`POST`) && PathRegexp(`(?i)^/api/whiteboards/[0-9a-f-]+/comment-threads(/[0-9a-f-]+/replies)?/?$`)"
      - "traefik.http.routers.clarin-whiteboard-comment-post.entrypoints=websecure"
      - "traefik.http.routers.clarin-whiteboard-comment-post.tls=true"
      - "traefik.http.routers.clarin-whiteboard-comment-post.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-whiteboard-comment-post.service=clarin-api"
      - "traefik.http.routers.clarin-whiteboard-comment-post.priority=260"
      - "traefik.http.routers.clarin-whiteboard-comment-post.middlewares=clarin-whiteboard-comment-limit"
      - "traefik.http.routers.clarin-whiteboard-comment-patch.rule=Host(`clarin.naperu.cloud`) && Method(`PATCH`) && PathRegexp(`(?i)^/api/whiteboards/[0-9a-f-]+/comment-threads/[0-9a-f-]+/(comments/[0-9a-f-]+|status)/?$`)"
      - "traefik.http.routers.clarin-whiteboard-comment-patch.entrypoints=websecure"
      - "traefik.http.routers.clarin-whiteboard-comment-patch.tls=true"
      - "traefik.http.routers.clarin-whiteboard-comment-patch.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-whiteboard-comment-patch.service=clarin-api"
      - "traefik.http.routers.clarin-whiteboard-comment-patch.priority=260"
      - "traefik.http.routers.clarin-whiteboard-comment-patch.middlewares=clarin-whiteboard-comment-limit"
      - "traefik.http.routers.clarin-whiteboard-comment-delete.rule=Host(`clarin.naperu.cloud`) && Method(`DELETE`) && PathRegexp(`(?i)^/api/whiteboards/[0-9a-f-]+/comment-threads/[0-9a-f-]+/comments/[0-9a-f-]+/?$`)"
      - "traefik.http.routers.clarin-whiteboard-comment-delete.entrypoints=websecure"
      - "traefik.http.routers.clarin-whiteboard-comment-delete.tls=true"
      - "traefik.http.routers.clarin-whiteboard-comment-delete.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-whiteboard-comment-delete.service=clarin-api"
      - "traefik.http.routers.clarin-whiteboard-comment-delete.priority=260"
      - "traefik.http.routers.clarin-whiteboard-comment-delete.middlewares=clarin-whiteboard-comment-limit"
      - "traefik.http.middlewares.clarin-whiteboard-comment-limit.buffering.maxRequestBodyBytes=16384"
      - "traefik.http.middlewares.clarin-whiteboard-comment-limit.buffering.memRequestBodyBytes=16384"
      # MCP Server (Model Context Protocol) on port 8081.
      - "traefik.http.routers.clarin-mcp.rule=Host(`clarin.naperu.cloud`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.clarin-mcp.entrypoints=websecure"
      - "traefik.http.routers.clarin-mcp.tls=true"
      - "traefik.http.routers.clarin-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.clarin-mcp.loadbalancer.server.port=8081"
      - "traefik.http.routers.clarin-mcp.service=clarin-mcp"
      - "traefik.http.routers.clarin-mcp.priority=110"
      # OAuth endpoints for ChatGPT MCP custom connectors.
      - "traefik.http.routers.clarin-mcp-oauth.rule=Host(`clarin.naperu.cloud`) && PathPrefix(`/oauth`)"
      - "traefik.http.routers.clarin-mcp-oauth.entrypoints=websecure"
      - "traefik.http.routers.clarin-mcp-oauth.tls=true"
      - "traefik.http.routers.clarin-mcp-oauth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-mcp-oauth.service=clarin-mcp"
      - "traefik.http.routers.clarin-mcp-oauth.priority=200"
      - "traefik.http.routers.clarin-mcp-well-known.rule=Host(`clarin.naperu.cloud`) && PathPrefix(`/.well-known`)"
      - "traefik.http.routers.clarin-mcp-well-known.entrypoints=websecure"
      - "traefik.http.routers.clarin-mcp-well-known.tls=true"
      - "traefik.http.routers.clarin-mcp-well-known.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-mcp-well-known.service=clarin-mcp"
      - "traefik.http.routers.clarin-mcp-well-known.priority=200"

  task-preview-worker:
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: clarin-task-preview-worker
    restart: unless-stopped
    user: "65532:65532"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clarin}:${POSTGRES_PASSWORD}@clarin-postgres:5432/${POSTGRES_DB:-clarin}?sslmode=disable
      MINIO_ENDPOINT: clarin-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-clarinadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: clarin-media
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: https://media.clarin.naperu.cloud
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TASK_PREVIEW_WORKER_ONLY: "true"
      HOME: /tmp/preview-home
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 768m
    cpus: 0.75
    networks:
      - clarin-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://clarin.naperu.cloud
        NEXT_PUBLIC_WS_URL: wss://clarin.naperu.cloud
        NEXT_PUBLIC_APP_URL: https://clarin.naperu.cloud
        NEXT_PUBLIC_MARKETING_URL: https://landing.clarin.naperu.cloud
    container_name: clarin-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://clarin.naperu.cloud
      NEXT_PUBLIC_WS_URL: wss://clarin.naperu.cloud
      NEXT_PUBLIC_APP_URL: https://clarin.naperu.cloud
      NEXT_PUBLIC_MARKETING_URL: https://landing.clarin.naperu.cloud
    depends_on:
      - backend
    ports:
      - "3001:3000"
    networks:
      - clarin-internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.middlewares.clarin-frontend-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.clarin-frontend-https.redirectscheme.permanent=true"
      - "traefik.http.routers.clarin-frontend-app.rule=Host(`clarin.naperu.cloud`)"
      - "traefik.http.routers.clarin-frontend-app.entrypoints=websecure"
      - "traefik.http.routers.clarin-frontend-app.tls=true"
      - "traefik.http.routers.clarin-frontend-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-frontend-app.service=clarin-frontend"
      - "traefik.http.routers.clarin-frontend-app.priority=1"
      - "traefik.http.routers.clarin-frontend-landing.rule=Host(`landing.clarin.naperu.cloud`)"
      - "traefik.http.routers.clarin-frontend-landing.entrypoints=websecure"
      - "traefik.http.routers.clarin-frontend-landing.tls=true"
      - "traefik.http.routers.clarin-frontend-landing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clarin-frontend-landing.service=clarin-frontend"
      - "traefik.http.routers.clarin-frontend-landing.priority=1"
      - "traefik.http.routers.clarin-frontend-app-http.rule=Host(`clarin.naperu.cloud`)"
      - "traefik.http.routers.clarin-frontend-app-http.entrypoints=web"
      - "traefik.http.routers.clarin-frontend-app-http.middlewares=clarin-frontend-https"
      - "traefik.http.routers.clarin-frontend-app-http.service=clarin-frontend"
      - "traefik.http.routers.clarin-frontend-landing-http.rule=Host(`landing.clarin.naperu.cloud`)"
      - "traefik.http.routers.clarin-frontend-landing-http.entrypoints=web"
      - "traefik.http.routers.clarin-frontend-landing-http.middlewares=clarin-frontend-https"
      - "traefik.http.routers.clarin-frontend-landing-http.service=clarin-frontend"
      - "traefik.http.services.clarin-frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  redis_data:
  whatsapp_sessions:
  minio_data:
  codex_bridge_home:
networks:
  clarin-internal:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.29.0.0/16"
        - subnet: "fd00:cafe:babe::/48"
  dokploy-network:
    external: true
